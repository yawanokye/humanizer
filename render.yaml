services:
  - type: web
    name: scholarly-humanizer
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: HUMANIZER_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: HUMANIZER_TIMEOUT_SECONDS
        value: "150"
      - key: HUMANIZER_ENGINE2_BATCH_WORDS
        value: "4200"
      - key: HUMANIZER_ENGINE2_PARALLELISM
        value: "3"
      - key: HUMANIZER_ENGINE2_BATCH_RETRIES
        value: "2"
      - key: HUMANIZER_JOB_WORKERS
        value: "1"
      - key: HUMANIZER_JOB_TTL_SECONDS
        value: "3600"
      - key: HUMANIZER_DOCX_FORMAT_PRESERVATION
        value: "true"
      - key: HUMANIZER_DOCUMENT_TTL_SECONDS
        value: "14400"
      - key: HUMANIZER_MAX_INPUT_CHARS
        value: "1200000"
      - key: HUMANIZER_MAX_UPLOAD_BYTES
        value: "15728640"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PROJECTREADY_HUMANIZER_PERPLEXITY_LEVEL
        value: high
      - key: PROJECTREADY_HUMANIZER_BURSTINESS_LEVEL
        value: high
      - key: PROJECTREADY_HUMANIZER_MAX_WORD_CHANGE_RATIO
        value: "0.18"
      - key: REFERENCE_LM_ENABLED
        value: "false"
      - key: HUMANIZER_BENCHMARK_LAB_ENABLED
        value: "false"
      - key: HUMANIZER_DEVELOPER_TOKEN
        sync: false
      - key: HUMANIZER_BENCHMARK_DIR
        value: /var/data/humanizer-calibration
      - key: HUMANIZER_CALIBRATION_MODEL
        value: /var/data/humanizer-calibration/meta_classifier.json
      - key: HUMANIZER_MAX_HUMAN_FPR
        value: "0.05"

# Optional v2.4 private Benchmark Lab variables to add in Render dashboard:
# HUMANIZER_BENCHMARK_LAB_ENABLED=false
# HUMANIZER_DEVELOPER_TOKEN=<secret>
# HUMANIZER_BENCHMARK_DIR=/var/data/humanizer-calibration  # persistent disk recommended
# HUMANIZER_CALIBRATION_MODEL=/var/data/humanizer-calibration/meta_classifier.json
# HUMANIZER_MAX_HUMAN_FPR=0.05
